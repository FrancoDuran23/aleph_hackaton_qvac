<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat — Demo Hackathon</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #0f1115;
    color: #e8e8ea;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 1.5rem 2rem;
    border-bottom: 1px solid #2a2d35;
    font-size: 1.4rem;
    font-weight: 600;
  }
  header span { color: #7c9cff; }
  #mensajes {
    flex: 1;
    overflow-y: auto;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }
  .msg {
    max-width: 70ch;
    padding: 1rem 1.4rem;
    border-radius: 1rem;
    font-size: 1.15rem;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: #2f3f8f;
  }
  .assistant {
    align-self: flex-start;
    background: #1c1f27;
    border: 1px solid #2a2d35;
  }
  .assistant.loading { color: #8a8d97; font-style: italic; }
  form {
    display: flex;
    gap: 0.75rem;
    padding: 1.5rem 2rem;
    border-top: 1px solid #2a2d35;
  }
  input {
    flex: 1;
    padding: 1rem 1.2rem;
    border-radius: 0.75rem;
    border: 1px solid #2a2d35;
    background: #1c1f27;
    color: #e8e8ea;
    font-size: 1.15rem;
  }
  input:focus { outline: 2px solid #7c9cff; }
  button {
    padding: 1rem 1.8rem;
    border-radius: 0.75rem;
    border: none;
    background: #7c9cff;
    color: #0f1115;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>Chat <span>·</span> demo del hackathon</header>
  <div id="mensajes"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Escribí tu pregunta..." autocomplete="off" autofocus>
    <button type="submit">Enviar</button>
  </form>
  <script src="/static/chat.js"></script>
</body>
</html>
