services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hackaton
      POSTGRES_PASSWORD: hackaton
      POSTGRES_DB: hackaton
    ports:
      - "5432:5432"
    volumes:
      - hackaton_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackaton"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://hackaton:hackaton@postgres:5432/hackaton
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./demo:/app/demo
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hackaton_pgdata:
